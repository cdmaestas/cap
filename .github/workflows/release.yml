name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-packages:
    name: Build and sign packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: sudo apt-get install -y rpm dpkg-dev debsigs debsig-verify shellcheck

      - name: Set version from tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          RPM_VER="${TAG//-/.}"
          echo "VERSION=$TAG" >> "$GITHUB_ENV"
          echo "RPM_VERSION=$RPM_VER" >> "$GITHUB_ENV"
          # Patch cap.spec Version: line (RPM forbids '-'; use '.')
          awk -v v="Version:      $RPM_VER" \
            '/^Version:/{print v; next} 1' cap.spec > /tmp/_spec && mv /tmp/_spec cap.spec
          # Patch debian/DEBIAN/control Version: line
          awk -v v="Version: $TAG-1" \
            '/^Version:/{print v; next} 1' \
            debian/DEBIAN/control > /tmp/_ctrl && mv /tmp/_ctrl debian/DEBIAN/control

      - name: Build source tarball
        env:
          CAP5DEVHOME: ${{ github.workspace }}
        run: |
          mkdir -p dist
          ./build-cap5.sh official tgz
          mv "cap-${RPM_VERSION}.tar.gz" "dist/"

      - name: Build RPM
        env:
          CAP5DEVHOME: ${{ github.workspace }}
        run: |
          mkdir -p dist
          ./build-cap5.sh official rpm
          find ~/redhat/RPMS -name "*.rpm" -exec cp {} dist/ \; 2>/dev/null || \
          find ~/.rpmbuild/RPMS  -name "*.rpm" -exec cp {} dist/ \; 2>/dev/null || true

      - name: Build DEB
        env:
          CAP5DEVHOME: ${{ github.workspace }}
        run: |
          mkdir -p dist
          ./build-cap5.sh official deb
          find . -maxdepth 1 -name "*.deb" -exec mv {} dist/ \;
          echo "--- deb member names ---"
          ar t dist/*.deb

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          printf '%s' "${GPG_PRIVATE_KEY}" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --keyid-format LONG 2>/dev/null \
            | grep "^sec" | head -1 | awk '{print $2}' | cut -d'/' -f2)
          echo "GPG_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          FINGERPRINT=$(gpg --with-colons --with-keygrip --list-secret-keys \
            | awk -F: '/^sec/{f=1} f && /^fpr/{print $10; exit}')
          echo "GPG_FINGERPRINT=$FINGERPRINT" >> "$GITHUB_ENV"
          mkdir -p ~/.gnupg
          printf 'allow-loopback-pinentry\nallow-preset-passphrase\n' >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          PASSPHRASE_FILE="${RUNNER_TEMP}/gpg-passphrase"
          install -m 600 /dev/null "${PASSPHRASE_FILE}"
          printf '%s' "${GPG_PASSPHRASE}" > "${PASSPHRASE_FILE}"
          echo "GPG_PASSPHRASE_FILE=${PASSPHRASE_FILE}" >> "$GITHUB_ENV"
          printf '%%_gpg_name %s\n%%__gpg /usr/bin/gpg\n%%__gpg_sign_cmd %%{__gpg} gpg --batch --no-verbose --no-armor --no-secmem-warning --pinentry-mode loopback --passphrase-file "%s" -u "%%{_gpg_name}" -sbo %%{__signature_filename} --digest-algo sha256 %%{__plaintext_filename}\n' \
            "$KEY_ID" "${PASSPHRASE_FILE}" > ~/.rpmmacros
          # debsigs (used to sign the DEB) has no --passphrase-file of its own —
          # it just calls plain gpg and relies on the agent already knowing the
          # passphrase. Preset it into the running agent's cache instead.
          KEYGRIP=$(gpg --with-colons --with-keygrip --list-secret-keys \
            | awk -F: '/^sec/{f=1} f && /^grp/{print $10; exit}')
          /usr/lib/gnupg/gpg-preset-passphrase --preset "$KEYGRIP" < "${PASSPHRASE_FILE}"

      - name: Sign RPM
        run: |
          for rpm in dist/*.rpm; do
            rpmsign --addsign "$rpm"
            echo "Signed: $rpm"
          done

      - name: Set up debsig-verify policy
        run: |
          POLICY_FPR=$(grep -oE 'id="[0-9A-F]{40}"' packaging/cap5-debsig-policy.pol \
            | head -1 | tr -d '"' | cut -d= -f2)
          if [[ "$POLICY_FPR" != "$GPG_FINGERPRINT" ]]; then
            echo "packaging/cap5-debsig-policy.pol is signed by $POLICY_FPR" >&2
            echo "but the currently imported key is $GPG_FINGERPRINT — update the" >&2
            echo "policy file's id= attributes after any key rotation." >&2
            exit 1
          fi
          gpg --export "$GPG_KEY_ID" > /tmp/debsig.gpg
          sudo install -D -m 644 /tmp/debsig.gpg \
            "/usr/share/debsig/keyrings/${GPG_FINGERPRINT}/debsig.gpg"
          sudo install -D -m 644 packaging/cap5-debsig-policy.pol \
            "/etc/debsig/policies/${GPG_FINGERPRINT}/generic.pol"

      - name: Sign DEB
        run: |
          for deb in dist/*.deb; do
            debsigs --sign=origin --default-key="$GPG_KEY_ID" "$deb"
            echo "Signed: $deb"
            debsigs --list "$deb"
          done

      - name: Clean up GPG passphrase file
        if: always()
        run: rm -f "${GPG_PASSPHRASE_FILE:-}"

      - name: Verify RPM signature
        run: |
          rpm --import packaging/RPM-GPG-KEY-cap5
          for rpm in dist/*.rpm; do
            rpm --checksig "$rpm" && echo "OK: $rpm"
          done

      - name: Verify DEB signature
        run: |
          # debsigs --verify is unimplemented in the Ubuntu-packaged version
          # ("Verify not yet implemented." at debsigs line 75) — call the
          # verifier it's supposed to wrap directly instead.
          for deb in dist/*.deb; do
            debsig-verify -d "$deb" && echo "OK: $deb"
          done

      - name: List artifacts
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "CAP5 ${{ env.VERSION }}"
          generate_release_notes: true
          files: |
            dist/*.rpm
            dist/*.deb
            dist/*.tar.gz
            packaging/RPM-GPG-KEY-cap5
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Delete old releases (keep newest 3)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
          | while read -r tag; do
              echo "Deleting release $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            done
